name: Checkout Demo

on:
  push:
  workflow_dispatch:

jobs:
  checkout_demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show files before checkout
        run: |
          echo "Before checkout:"
          pwd
          ls -la

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show files after checkout
        run: |
          echo "After checkout:"
          pwd
          ls -la

      - name: Read README file
        run: cat README.md
